name: Images

# After CI passes on main (or when a version tag is pushed): build the two images, publish them to
# GitHub Container Registry. The server runs from the shared deploy folder (next to this project), not from here.
on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  images:
    name: Build and publish images
    # a tag push or a manual run always builds; a workflow_run only after a green CI
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      owner: ${{ steps.meta.outputs.owner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Image owner and tag
        id: meta
        env:
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then tag="${GITHUB_REF_NAME}"; else tag="sha-${SHA::12}"; fi
          echo "owner=${owner}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push api (also used by worker and migrate)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: api
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/bizsuite-api:${{ steps.meta.outputs.tag }}
            ghcr.io/${{ steps.meta.outputs.owner }}/bizsuite-api:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max
      - name: Build and push web (nginx + SPA)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: web
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/bizsuite-web:${{ steps.meta.outputs.tag }}
            ghcr.io/${{ steps.meta.outputs.owner }}/bizsuite-web:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

