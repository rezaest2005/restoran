name: CI

# Every push and pull request: backend tests, frontend build, and a full docker smoke test.
on:
  push:
    branches: [main, web, build_up]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Django tests)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bizsuite
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: bizsuite
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U bizsuite -d bizsuite"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      SECRET_KEY: ci-only-not-a-secret
      DEBUG: "True"
      DB_NAME: bizsuite
      DB_USER: bizsuite
      DB_PASSWORD: ci-only-password
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: dashboard/requirements.txt
      - run: pip install -r requirements.txt
      - name: Django system check
        run: python manage.py check
      - name: Migrations are in sync with the models
        run: python manage.py makemigrations --check --dry-run
      - name: Tests
        run: python manage.py test tests

  frontend:
    name: Frontend (i18n check + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Every translation key exists in both languages
        run: npm run check:i18n
      - name: Production build
        run: npm run build
      # Lint still reports older findings; shown for information until they are cleaned up.
      - name: Lint (informational)
        run: npm run lint
        continue-on-error: true

  docker-smoke:
    name: Docker (build + smoke test)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Throw-away settings
        run: |
          DBP="ci-$(openssl rand -hex 12)"
          {
            echo "SECRET_KEY=ci-only-$(openssl rand -hex 24)"
            echo "DEBUG=False"
            echo "ALLOWED_HOSTS=localhost,127.0.0.1"
            echo "DB_NAME=bizsuite"
            echo "DB_USER=bizsuite"
            echo "DB_PASSWORD=$DBP"
            echo "DB_HOST=db"
            echo "DB_PORT=5432"
            echo "BOOTSTRAP_ADMIN_PASSWORD=ci-$(openssl rand -hex 12)"
            echo "BOOTSTRAP_SUPER_PASSWORD=ci-$(openssl rand -hex 12)"
          } > ci.env
      - name: Build the two images
        run: |
          docker build --target api -t bizsuite-api:ci .
          docker build --target web -t bizsuite-web:ci .
      - name: Start db -> migrate -> api -> web
        run: |
          set -e
          docker network create bz
          docker run -d --name db --network bz --env-file ci.env             -e POSTGRES_DB=bizsuite -e POSTGRES_USER=bizsuite -e POSTGRES_PASSWORD="$(sed -n 's/^DB_PASSWORD=//p' ci.env)" postgres:16
          for i in $(seq 1 30); do docker exec db pg_isready -U bizsuite -d bizsuite && break; sleep 2; done
          docker run --rm --network bz --env-file ci.env bizsuite-api:ci sh /app/migrate.sh
          docker run -d --name api --network bz --env-file ci.env bizsuite-api:ci sh /app/entrypoint.sh
          docker run -d --name web --network bz -p 18080:80 bizsuite-web:ci
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:18080/api/health/ >/dev/null 2>&1 && break; sleep 2; done
      - name: Smoke test through the web container
        run: |
          set -e
          curl -fsS http://127.0.0.1:18080/api/health/
          curl -fsS http://127.0.0.1:18080/api/app/info/ >/dev/null
          curl -fsS -o /dev/null http://127.0.0.1:18080/            # the SPA
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/q/zzzzzzzz/)" = "404"   # QR redirect reaches the api
      - name: Logs on failure
        if: failure()
        run: for c in db api web; do echo "== $c"; docker logs --tail=100 $c || true; done
      - name: Tear down
        if: always()
        run: docker rm -f db api web || true
