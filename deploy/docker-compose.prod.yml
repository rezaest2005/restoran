# Production override: run the images built by CI instead of building on the server.
#   IMAGE_OWNER=<github user/org, lowercase> IMAGE_TAG=<sha-xxxx or vX.Y.Z> \
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# (deploy/deploy.sh does exactly this.) The .env file stays next to the compose files on the server.

x-api-image: &api-image
  image: ghcr.io/${IMAGE_OWNER:?set IMAGE_OWNER}/bizsuite-api:${IMAGE_TAG:-latest}
  pull_policy: always

services:
  migrate:
    <<: *api-image
  api:
    <<: *api-image
  worker:
    <<: *api-image
  web:
    image: ghcr.io/${IMAGE_OWNER:?set IMAGE_OWNER}/bizsuite-web:${IMAGE_TAG:-latest}
    pull_policy: always
