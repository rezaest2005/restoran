# DNS داخلی Docker: تا نام سرویس web هر ۱۰ ثانیه دوباره resolve بشه
# (این خط، مقیاس‌پذیری افقی را ممکن می‌کند)
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    listen [::]:80;
    server_name _;
    client_max_body_size 10M;

    # ---------- فایل‌های استاتیک React (از image nginx) ----------
    location ^~ /assets/ {
        root /usr/share/nginx/html;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location ~* \.(svg|ico|png|jpg|jpeg|gif|woff2?)$ {
        root /usr/share/nginx/html;
        expires 30d;
    }

    # ---------- static و media: مستقیم از دیسک، بدون عبور از Django ----------
    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public";
    }

    location /media/ {
        alias /app/media/;
        expires 7d;
    }

    # ---------- API → Django ----------
    location /api/ {
        set $backend http://web:8000;   # با متغیر: resolve پویا در هر درخواست
        proxy_pass $backend;
        proxy_set_header Host est.rysh.ir;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host est.rysh.ir;

        # timeout های هماهنگ با Gunicorn (هر لایه جلوتر، کوتاه‌تر یا مساوی)
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;

        # اگر یک instance از کار افتاد، درخواست به instance بعدی برود
        proxy_next_upstream error timeout http_502 http_504;
    }

    location /admin/ {
        set $backend http://web:8000;
        proxy_pass $backend;
        proxy_set_header Host est.rysh.ir;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host est.rysh.ir;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    # ---------- API چندمستأجری: /{slug}/api/... ----------
    location ~ ^/[a-z0-9-]+/api/ {
        set $backend http://web:8000;
        proxy_pass $backend;
        proxy_set_header Host est.rysh.ir;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host est.rysh.ir;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        proxy_next_upstream error timeout http_502 http_504;
    }

    # ---------- React SPA ----------
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}