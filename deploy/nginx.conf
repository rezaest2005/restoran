server {
    listen 8000;
    listen [::]:8000;
    server_name _;
    client_max_body_size 10M;

    # ★ React SPA assets
    location ^~ /assets/ {
        root /usr/share/nginx/html;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location ^~ /img/ {
        root /usr/share/nginx/html;
        expires 30d;
    }

    # ★ /dashboard/ → Django  (با ^~)
    location ^~ /dashboard/ {
        proxy_pass http://web:8000/dashboard/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ★ /admin/ → Django  (با ^~)
    location ^~ /admin/ {
        proxy_pass http://web:8000/admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ★ /users/ → Django  (با ^~)
    location ^~ /users/ {
        proxy_pass http://web:8000/users/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ★ /api/ → Django  (با ^~)
    location ^~ /api/ {
        proxy_pass http://web:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ★ /static/
    location ^~ /static/ {
        proxy_pass http://web:8000/static/;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ★ /media/
    location ^~ /media/ {
        proxy_pass http://web:8000/media/;
        proxy_set_header Host $host;
        expires 7d;
    }

    # ★ فایل‌های استاتیک
    location ~* \.(svg|ico|png|jpg|jpeg|gif|woff2?)$ {
        root /usr/share/nginx/html;
        expires 30d;
    }

    # ★ /{slug}/... → Django (رستوران لاگین و اشتراک)
    #    این regex فقط وقتی اجرا میشه که
    #    هیچکدوم از ^~ بالا مچ نشده باشن
    location ~ ^/[a-z0-9-]+/ {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ★ React SPA (آخرین rule)
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}