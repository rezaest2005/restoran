# Edge عمومی: ArvanCloud → host:8000 → این nginx
# Host بیرونی اغلب IP سرور است؛ برای Django دامنه عمومی را ست می‌کنیم.

server {
    listen 80;
    listen [::]:80;
    server_name _;
    client_max_body_size 10M;

    # React assets (از image nginx)
    location ^~ /assets/ {
        root /usr/share/nginx/html;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # API → Django (سرویس web داخل compose network)
    location /api/ {
        proxy_pass http://web:8000;
        proxy_set_header Host est.rysh.ir;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host est.rysh.ir;
    }

    location /admin/ {
        proxy_pass http://web:8000;
        proxy_set_header Host est.rysh.ir;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host est.rysh.ir;
    }

    location /static/ {
        proxy_pass http://web:8000;
        proxy_set_header Host est.rysh.ir;
    }

    location /media/ {
        proxy_pass http://web:8000;
        proxy_set_header Host est.rysh.ir;
    }

    # API چندمستأجری: /{slug}/api/...
    location ~ ^/[a-z0-9-]+/api/ {
        proxy_pass http://web:8000;
        proxy_set_header Host est.rysh.ir;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host est.rysh.ir;
    }

    location ~* \.(svg|ico|png|jpg|jpeg|gif|woff2?)$ {
        root /usr/share/nginx/html;
        expires 30d;
    }

    # React SPA
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
