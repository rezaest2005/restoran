# Business Suite - production-style stack.
#   cp deploy/.env.example deploy/.env   (then fill in the values)
#   docker compose -f deploy/docker-compose.yml up -d --build
#
# Services: db (postgres) -> migrate (one-shot) -> api (gunicorn) + worker (run_jobs)
#           web (nginx: SPA + /static/ + /media/, proxies /api/ to api)

x-api-common: &api-common
  build:
    context: ..
    dockerfile: deploy/Dockerfile
    target: api
  env_file:
    - .env
  environment:
    DEBUG: "False"
    DB_HOST: db
    DB_PORT: "5432"

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${DB_NAME:-bizsuite}
      POSTGRES_USER: ${DB_USER:-bizsuite}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in deploy/.env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-bizsuite} -d ${DB_NAME:-bizsuite}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # One-shot: apply migrations and bootstrap the initial users.
  migrate:
    <<: *api-common
    command: ["sh", "/app/migrate.sh"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    <<: *api-common
    command: ["sh", "/app/entrypoint.sh"]
    volumes:
      - media_data:/app/media
    expose:
      - "8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:8000/api/health/', headers={'Host': 'localhost'}), timeout=3).status == 200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  worker:
    <<: *api-common
    command: ["python", "manage.py", "run_jobs"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: web
      args:
        APP_BASE_PATH: ${URL_PREFIX:-}
    ports:
      - "${WEB_PORT:-8080}:80"
    volumes:
      - media_data:/srv/media:ro
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

volumes:
  pgdata:
  media_data:
