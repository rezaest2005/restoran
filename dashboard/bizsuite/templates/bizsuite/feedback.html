<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ثبت نظرات</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; padding: 16px; background: #f0f4f8; color: #1b2a4a;
         font-family: Vazirmatn, Tahoma, sans-serif; font-size: 14px; }
  .wrap { max-width: 900px; margin: 0 auto; }
  header { display: flex; justify-content: space-between; align-items: center;
           flex-wrap: wrap; gap: 10px; margin-bottom: 14px; }
  h1 { font-size: 20px; margin: 0; }
  a.back { color: #3b82f6; text-decoration: none; }
  .filters { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
  select, textarea, button { font: inherit; padding: 8px 10px; border: 1.5px solid #d0dbe8;
         border-radius: 10px; background: #fff; }
  button { background: #1b2a4a; color: #fff; border: 0; cursor: pointer; }
  .item { background: #fff; border-radius: 14px; padding: 14px; margin-bottom: 12px;
          box-shadow: 0 2px 10px rgba(27,42,74,.06); }
  .meta { display: flex; gap: 8px; flex-wrap: wrap; color: #7a8fa3; font-size: 12px; margin-bottom: 8px; }
  .badge { padding: 2px 10px; border-radius: 20px; background: #eef2f7; color: #1b2a4a; }
  .badge.open { background: #fdeaea; color: #c0392b; }
  .badge.in_progress { background: #fff4e0; color: #b9770e; }
  .badge.resolved { background: #e6f9ee; color: #1a7f45; }
  .text { white-space: pre-wrap; margin-bottom: 10px; }
  .edit { display: flex; gap: 8px; flex-wrap: wrap; align-items: flex-start; }
  .edit textarea { flex: 1; min-width: 200px; min-height: 60px; }
  .empty { text-align: center; color: #7a8fa3; padding: 30px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>ثبت نظرات مشتریان</h1>
    <a class="back" href="{% url 'dashboard_app' %}">بازگشت به داشبورد</a>
  </header>

  <div class="filters">
    <select id="fStatus">
      <option value="">همه وضعیت‌ها</option>
      <option value="open">باز</option>
      <option value="in_progress">در حال بررسی</option>
      <option value="resolved">حل‌شده</option>
    </select>
    <select id="fCategory">
      <option value="">همه دسته‌ها</option>
      <option value="bug">مشکل / خطا</option>
      <option value="suggestion">پیشنهاد</option>
      <option value="complaint">شکایت</option>
      <option value="other">سایر</option>
    </select>
  </div>

  <div id="list"></div>
</div>

<script>
  function getCookie(name) {
    let v = null;
    document.cookie.split(';').forEach(c => {
      c = c.trim();
      if (c.startsWith(name + '=')) v = decodeURIComponent(c.substring(name.length + 1));
    });
    return v;
  }
  const csrftoken = getCookie('csrftoken');
  const listEl = document.getElementById('list');
  const fStatus = document.getElementById('fStatus');
  const fCategory = document.getElementById('fCategory');

  // متن کاربر همیشه با textContent درج می‌شود (جلوگیری از XSS)
  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  }

  function fmt(iso) {
    try { return new Date(iso).toLocaleString('fa-IR'); } catch (e) { return iso; }
  }

  async function load() {
    const q = new URLSearchParams();
    if (fStatus.value) q.set('status', fStatus.value);
    if (fCategory.value) q.set('category', fCategory.value);
    listEl.replaceChildren(el('div', 'empty', 'در حال بارگذاری...'));
    try {
      const res = await fetch('/api/feedback/list/?' + q, {
        headers: { 'Accept': 'application/json' }, credentials: 'same-origin',
      });
      const json = await res.json();
      if (!res.ok || !json.success) throw new Error(json.error || json.detail || 'خطا');
      render(json.data || []);
    } catch (err) {
      listEl.replaceChildren(el('div', 'empty', 'خطا در دریافت اطلاعات: ' + err.message));
    }
  }

  function render(items) {
    if (!items.length) { listEl.replaceChildren(el('div', 'empty', 'موردی یافت نشد.')); return; }
    listEl.replaceChildren(...items.map(card));
  }

  function card(f) {
    const box = el('div', 'item');
    const meta = el('div', 'meta');
    meta.append(
      el('span', 'badge ' + f.status, f.status_display),
      el('span', 'badge', f.category_display),
      el('span', '', f.name || 'بدون نام'),
      el('span', '', f.phone || ''),
      el('span', '', fmt(f.created_at)),
    );
    const text = el('div', 'text', f.message);

    const edit = el('div', 'edit');
    const sel = document.createElement('select');
    [['open', 'باز'], ['in_progress', 'در حال بررسی'], ['resolved', 'حل‌شده']].forEach(([v, l]) => {
      const o = el('option', '', l); o.value = v; if (v === f.status) o.selected = true; sel.append(o);
    });
    const note = el('textarea'); note.placeholder = 'یادداشت مدیر'; note.value = f.admin_note || '';
    const btn = el('button', '', 'ذخیره');
    btn.addEventListener('click', async () => {
      btn.disabled = true;
      try {
        const res = await fetch('/api/feedback/' + f.id + '/update/', {
          method: 'POST', credentials: 'same-origin',
          headers: { 'Content-Type': 'application/json', 'X-CSRFToken': csrftoken },
          body: JSON.stringify({ status: sel.value, admin_note: note.value }),
        });
        const json = await res.json().catch(() => ({}));
        if (!res.ok || !json.success) throw new Error(json.error || json.detail || 'خطا');
        btn.textContent = 'ذخیره شد';
        setTimeout(load, 600);
      } catch (err) {
        btn.textContent = 'خطا در ذخیره';
      } finally { btn.disabled = false; }
    });
    edit.append(sel, note, btn);
    box.append(meta, text, edit);
    return box;
  }

  fStatus.addEventListener('change', load);
  fCategory.addEventListener('change', load);
  load();
</script>
</body>
</html>
