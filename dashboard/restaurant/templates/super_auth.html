<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>ورود مدیر کل سیستم</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #08080f;
      --surface: rgba(255,255,255,0.04);
      --surface-hover: rgba(255,255,255,0.08);
      --accent: #818cf8;
      --accent-dim: rgba(129,140,248,0.15);
      --accent-glow: rgba(129,140,248,0.25);
      --text: #e8e6e3;
      --text-muted: #5a5866;
      --border: rgba(255,255,255,0.07);
      --danger: #f87171;
      --danger-dim: rgba(248,113,113,0.12);
    }

    body {
      font-family: 'Cormorant Garamond', serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 600px 400px at 25% 30%, rgba(99,102,241,0.08) 0%, transparent 70%),
        radial-gradient(ellipse 500px 500px at 75% 70%, rgba(139,92,246,0.06) 0%, transparent 70%);
      pointer-events: none;
    }

    body::after {
      content: '';
      position: fixed;
      inset: 0;
      opacity: 0.025;
      pointer-events: none;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='1'/%3E%3C/svg%3E");
      background-repeat: repeat;
      background-size: 256px 256px;
    }

    .orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.07;
      animation: orbFloat 20s ease-in-out infinite alternate;
      pointer-events: none;
    }
    .orb-1 { width: 400px; height: 400px; background: #6366f1; top: -100px; right: -100px; }
    .orb-2 { width: 300px; height: 300px; background: #8b5cf6; bottom: -80px; left: -60px; animation-delay: -10s; }
    .orb-3 { width: 200px; height: 200px; background: #a78bfa; top: 50%; left: 50%; animation-delay: -5s; }

    @keyframes orbFloat {
      0%   { transform: translate(0, 0) scale(1); }
      100% { transform: translate(30px, -20px) scale(1.1); }
    }

    .auth-container {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 420px;
      padding: 20px;
      opacity: 0;
      animation: containerIn 0.8s ease forwards;
      animation-delay: 0.2s;
    }

    @keyframes containerIn {
      from { opacity: 0; transform: translateY(24px) scale(0.97); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    .auth-badge { text-align: center; margin-bottom: 28px; }
    .badge-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--accent-dim);
      border: 1px solid rgba(129,140,248,0.15);
      border-radius: 100px;
      padding: 6px 16px;
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      color: var(--accent);
      letter-spacing: 0.05em;
    }
    .badge-dot {
      width: 6px; height: 6px;
      background: var(--accent);
      border-radius: 50%;
      animation: dotPulse 2s ease-in-out infinite;
    }
    @keyframes dotPulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

    .auth-header { text-align: center; margin-bottom: 32px; }
    .auth-icon {
      width: 56px; height: 56px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      margin-bottom: 18px;
    }
    .auth-title { font-size: 28px; font-weight: 700; color: var(--text); line-height: 1.3; }
    .auth-subtitle {
      font-family: 'DM Mono', monospace;
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 6px;
      letter-spacing: 0.03em;
    }

    .auth-form {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 28px 24px;
      backdrop-filter: blur(20px);
    }

    .error-box {
      background: var(--danger-dim);
      border: 1px solid rgba(248,113,113,0.15);
      border-radius: 10px;
      padding: 10px 14px;
      margin-bottom: 16px;
      display: none;
    }
    .error-box p {
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      color: var(--danger);
      font-weight: 500;
    }

    .input-group { margin-bottom: 16px; }
    .input-group label {
      display: block;
      font-family: 'DM Mono', monospace;
      font-size: 10px; font-weight: 500;
      color: var(--text-muted);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
    .input-group input {
      width: 100%;
      padding: 12px 14px;
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--border);
      border-radius: 10px;
      font-family: 'Cormorant Garamond', serif;
      font-size: 15px; font-weight: 600;
      color: var(--text);
      outline: none;
      transition: all 0.2s ease;
    }
    .input-group input::placeholder { color: var(--text-muted); font-weight: 400; }
    .input-group input:focus {
      border-color: var(--accent);
      background: rgba(129,140,248,0.05);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    .submit-btn {
      width: 100%;
      padding: 13px 20px;
      background: var(--accent);
      border: none;
      border-radius: 10px;
      font-family: 'Cormorant Garamond', serif;
      font-size: 16px; font-weight: 700;
      color: var(--bg);
      cursor: pointer;
      transition: all 0.2s ease;
      margin-top: 4px;
      position: relative;
      overflow: hidden;
    }
    .submit-btn:hover {
      background: #a5b4fc;
      transform: translateY(-1px);
      box-shadow: 0 8px 24px rgba(129,140,248,0.25);
    }
    .submit-btn:active { transform: translateY(0); }
    .submit-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: none; }
    .submit-btn .spinner {
      display: none; width: 16px; height: 16px;
      border: 2px solid rgba(8,8,15,0.3);
      border-top-color: var(--bg);
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      margin: 0 auto;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .submit-btn.loading .btn-text { display: none; }
    .submit-btn.loading .spinner { display: inline-block; }

    .security-note {
      margin-top: 20px; padding: 14px 16px;
      background: rgba(255,255,255,0.02);
      border: 1px solid var(--border);
      border-radius: 10px;
      display: flex; align-items: flex-start; gap: 10px;
    }
    .security-note .ico { font-size: 16px; flex-shrink: 0; margin-top: 1px; }
    .security-note p {
      font-family: 'DM Mono', monospace;
      font-size: 10px; color: var(--text-muted); line-height: 1.7;
    }

    .back-link { text-align: center; margin-top: 20px; }
    .back-link a {
      font-family: 'DM Mono', monospace;
      font-size: 11px; color: var(--text-muted);
      text-decoration: none; transition: color 0.2s;
      display: inline-flex; align-items: center; gap: 6px;
    }
    .back-link a:hover { color: var(--accent); }

    .key-hints {
      position: fixed; bottom: 20px; left: 50%;
      transform: translateX(-50%);
      display: flex; gap: 16px;
      opacity: 0; animation: fadeIn 0.5s ease forwards; animation-delay: 1.2s;
    }
    @keyframes fadeIn { to { opacity: 1; } }
    .key-hint {
      display: flex; align-items: center; gap: 6px;
      font-family: 'DM Mono', monospace;
      font-size: 10px; color: rgba(255,255,255,0.2);
    }
    .key-hint kbd {
      display: inline-flex; align-items: center; justify-content: center;
      min-width: 22px; height: 22px; padding: 0 5px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 5px; font-size: 9px;
    }

    @media (max-width: 480px) {
      .auth-container { padding: 16px; }
      .auth-form { padding: 24px 20px; }
      .auth-title { font-size: 24px; }
      .key-hints { display: none; }
    }
  </style>
</head>
<body>

  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>

  <div class="auth-container">

    <div class="auth-badge">
      <div class="badge-pill">
        <span class="badge-dot"></span>
        مدیریت کلان سیستم
      </div>
    </div>

    <div class="auth-header">
      <div class="auth-icon">🏪</div>
      <h1 class="auth-title">ورود مدیر کل</h1>
      <p class="auth-subtitle">Super Admin Access</p>
    </div>

    <div class="auth-form">
      <div class="error-box" id="error-box">
        <p id="error-msg"></p>
      </div>

      <div class="input-group">
        <label>نام کاربری</label>
        <input type="text"
               id="username"
               placeholder="superadmin"
               autocomplete="username"
               autofocus>
      </div>

      <div class="input-group">
        <label>رمز عبور</label>
        <input type="password"
               id="password"
               placeholder="رمز عبور"
               autocomplete="current-password">
      </div>

      <button class="submit-btn" id="submit-btn" onclick="doLogin()">
        <span class="btn-text">ورود به پنل مدیریت</span>
        <span class="spinner"></span>
      </button>

      <div class="security-note">
        <span class="ico">🔒</span>
        <p>این بخش فقط برای مدیران کل سیستم قابل دسترسی است. تمامی فعالیت‌ها ثبت و نظارت می‌شود.</p>
      </div>
    </div>

    <div class="back-link">
      <a href="/dashboard/app/">← بازگشت به پنل رستوران</a>
    </div>

  </div>

  <div class="key-hints">
    <span class="key-hint"><kbd>Enter</kbd> ورود</span>
    <span class="key-hint"><kbd>Esc</kbd> پاک کردن</span>
  </div>

<script>
  var errorBox = document.getElementById('error-box');
  var errorMsg = document.getElementById('error-msg');
  var submitBtn = document.getElementById('submit-btn');

  function showError(msg) {
    errorMsg.textContent = msg;
    errorBox.style.display = 'block';
    errorBox.style.animation = 'none';
    errorBox.offsetHeight;
    errorBox.style.animation = 'shakeIn 0.4s ease';
  }
  function hideError() {
    errorBox.style.display = 'none';
  }

  var style = document.createElement('style');
  style.textContent = '@keyframes shakeIn{0%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(2px)}100%{transform:translateX(0)}}';
  document.head.appendChild(style);

  function getCookie(name) {
    var value = null;
    document.cookie.split(';').forEach(function(c) {
      c = c.trim();
      if (c.startsWith(name + '=')) {
        value = decodeURIComponent(c.slice(name.length + 1));
      }
    });
    return value;
  }

  async function doLogin() {
    var username = document.getElementById('username').value.trim();
    var password = document.getElementById('password').value;

    hideError();

    if (!username) {
      showError('نام کاربری را وارد کنید');
      document.getElementById('username').focus();
      return;
    }
    if (!password) {
      showError('رمز عبور را وارد کنید');
      document.getElementById('password').focus();
      return;
    }

    submitBtn.disabled = true;
    submitBtn.classList.add('loading');

    try {
      var res = await fetch('/api/super/login/', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'X-CSRFToken': getCookie('csrftoken') || ''
        },
        body: JSON.stringify({ username: username, password: password }),
        credentials: 'same-origin'
      });

      var data = await res.json().catch(function() { return {}; });

      if (res.ok && data.ok) {
        submitBtn.classList.remove('loading');
        submitBtn.style.background = '#10b981';
        submitBtn.querySelector('.btn-text').textContent = 'ورود موفقیت‌آمیز';

        setTimeout(function() {
          window.location.href = '/dashboard/super/';
        }, 400);

      } else {
        submitBtn.disabled = false;
        submitBtn.classList.remove('loading');
        showError(data.error || 'نام کاربری یا رمز عبور اشتباه است');
        document.getElementById('password').select();
      }
    } catch (e) {
      submitBtn.disabled = false;
      submitBtn.classList.remove('loading');
      showError('خطا در اتصال به سرور');
    }
  }

  document.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') {
      doLogin();
    } else if (e.key === 'Escape') {
      document.getElementById('username').value = '';
      document.getElementById('password').value = '';
      hideError();
      document.getElementById('username').focus();
    }
  });

  document.getElementById('username').addEventListener('input', hideError);
  document.getElementById('password').addEventListener('input', hideError);
</script>

</body>
</html>
