<script>
  // ═══════════════════════════════════════════════════════════
  //  لایه ۰: خواندن پارامتر next
  // ═══════════════════════════════════════════════════════════
  var urlParams = new URLSearchParams(window.location.search);
  var nextUrl = urlParams.get('next');

  // ═══════════════════════════════════════════════════════════
  //  لایه ۱: API Client
  // ═══════════════════════════════════════════════════════════
  var API_BASE = '/api/auth';

  function getCookie(name) {
    var v = null;
    document.cookie.split(';').forEach(function(c) {
      c = c.trim();
      if (c.startsWith(name + '=')) v = decodeURIComponent(c.slice(name.length + 1));
    });
    return v;
  }

  var api = {
    csrf: function() { return getCookie('csrftoken') || ''; },

    post: async function(url, body) {
      try {
        var res = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'X-CSRFToken': api.csrf() },
          body: JSON.stringify(body),
        });
        var data = await res.json().catch(function() { return {}; });
        return { ok: res.ok, data: data };
      } catch (err) {
        return { ok: false, data: {}, networkError: true };
      }
    },

    get: async function(url) {
      try {
        var res = await fetch(url, { credentials: 'same-origin' });
        if (!res.ok) return null;
        return await res.json();
      } catch (e) {
        return null;
      }
    },
  };

  // ═══════════════════════════════════════════════════════════
  //  لایه ۲: Store
  // ═══════════════════════════════════════════════════════════
  var store = (function() {
    var state = { status: 'idle', message: '', tab: 'login' };
    return {
      get: function() { return state; },
      set: function(patch) {
        state = Object.assign({}, state, patch);
        render(state);
      },
    };
  })();

  // ═══════════════════════════════════════════════════════════
  //  لایه ۳: View — UI = f(state)
  // ═══════════════════════════════════════════════════════════
  function $(id) { return document.getElementById(id); }

  function render(s) {
    var errBox  = $('msg-error');
    var okBox   = $('msg-success');
    var pendBox = $('msg-pending');

    if (errBox)  errBox.classList.remove('show');
    if (okBox)   okBox.classList.remove('show');
    if (pendBox) pendBox.classList.remove('show');

    if (s.message) {
      if (s.status === 'error') {
        if (errBox) {
          $('msg-error-text').textContent = s.message;
          errBox.classList.add('show');
        }
      } else if (s.status === 'success') {
        if (okBox) {
          $('msg-success-text').textContent = s.message;
          okBox.classList.add('show');
        }
      } else if (s.status === 'pending') {
        if (pendBox) {
          $('msg-pending-text').textContent = s.message;
          pendBox.classList.add('show');
        }
      }
    }

    document.querySelectorAll('.btn-primary').forEach(function(btn) {
      btn.disabled = (s.status === 'loading');
      if (s.status === 'loading') btn.classList.add('loading');
      else btn.classList.remove('loading');
    });

    var ft = $('form-title');
    var fs = $('form-subtitle');
    var isLogin = s.tab === 'login';
    if (ft) ft.textContent = isLogin ? 'خوش آمدید' : 'ایجاد حساب جدید';
    if (fs) fs.textContent = isLogin ? 'برای ادامه وارد حساب خود شوید' : 'ثبت‌نام کنید و از امکانات استفاده کنید';
  }

  // ═══════════════════════════════════════════════════════════
  //  ★ عنوان بر اساس next
  // ═══════════════════════════════════════════════════════════
  if (nextUrl && nextUrl.includes('/super')) {
    document.addEventListener('DOMContentLoaded', function() {
      $('form-title').textContent = 'ورود مدیر کل';
      $('form-subtitle').textContent = 'پنل مدیریت کلان سیستم';
      document.title = 'ورود مدیر کل';
    });
  }

  // ═══════════════════════════════════════════════════════════
  //  ★ بررسی لاگین قبلی
  // ═══════════════════════════════════════════════════════════
  document.addEventListener('DOMContentLoaded', function() {
    api.get(API_BASE + '/me/').then(function(user) {
      if (user && user.username) {
        // اگر next دارد و superuser است → برو به next
        if (nextUrl && user.is_superuser) {
          window.location.href = nextUrl;
        }
        // اگر next دارد ولی superuser نیست → برو به داشبورد
        else if (nextUrl && !user.is_superuser) {
          window.location.href = '/dashboard/app/';
        }
        // بدون next → رفتار عادی
        else {
          window.location.href = redirectFor(user);
        }
      }
    }).catch(function() {});
  });

  // ═══════════════════════════════════════════════════════════
  //  توابع کمکی
  // ═══════════════════════════════════════════════════════════
  var ROUTES = {
    owner: '/dashboard/app/',
    manager: '/dashboard/app/',
    cashier: '/dashboard/pos/',
    kitchen: '/dashboard/kitchen/',
    customer: '/dashboard/app/',
  };

  function redirectFor(user) {
    if (!user) return '/dashboard/';
    // ★ اگر next پارامتر دارد
    if (nextUrl) {
      if (user.is_superuser) return nextUrl;
      return '/dashboard/app/';
    }
    // حالت عادی
    if (user.is_superuser) return '/dashboard/super/';
    return ROUTES[user.role] || '/dashboard/';
  }

  function buildIdentity(id) {
    return /^09\d{9}$/.test(id) ? { phone_number: id } : { username: id };
  }

  async function persistSession(access, refresh, user) {
    localStorage.setItem('access_token', access);
    localStorage.setItem('refresh_token', refresh);
    localStorage.setItem('user', JSON.stringify(user));
    try {
      await api.post(API_BASE + '/set-session/', {
        access_token: access,
        user_id: user.id,
      });
    } catch (e) {}
  }

  function switchTab(tab) {
    store.set({ tab: tab, status: 'idle', message: '' });
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function togglePass(inputId, btn) {
    var input = $(inputId);
    var show = input.type === 'password';
    input.type = show ? 'text' : 'password';
    btn.innerHTML = show ? '&#128064;' : '&#128065;';
  }

  // ═══════════════════════════════════════════════════════════
  //  منطق اصلی: ورود
  // ═══════════════════════════════════════════════════════════
  async function handleLogin(e) {
    if (e && e.preventDefault) e.preventDefault();
    store.set({ status: 'loading', message: '' });

    var username = ($('login-username') || {}).value || '';
    var password = ($('login-password') || {}).value || '';
    username = username.trim();

    if (!username || !password) {
      store.set({ status: 'error', message: 'نام کاربری و رمز عبور را وارد کنید.' });
      return;
    }

    var result = await api.post(API_BASE + '/login/', Object.assign(
      buildIdentity(username),
      { password: password }
    ));

    if (result.networkError) {
      store.set({ status: 'error', message: 'خطا در اتصال به سرور.' });
      return;
    }

    var data = result.data;

    if (data.pending || (data.data && data.data.pending)) {
      store.set({ status: 'pending', message: data.error || data.message || 'حساب شما هنوز توسط مدیر تأیید نشده.' });
      return;
    }

    if (!result.ok || !data.access) {
      store.set({ status: 'error', message: data.error || data.detail || 'خطا در ورود. دوباره تلاش کنید.' });
      return;
    }

    // ★ redirect بر اساس next یا role
    var redirectUrl = redirectFor(data.user);
    store.set({ status: 'success', message: 'ورود موفقیت‌آمیز! در حال انتقال...' });
    await persistSession(data.access, data.refresh, data.user);

    setTimeout(function() {
      window.location.href = redirectUrl;
    }, 500);
  }

  // ═══════════════════════════════════════════════════════════
  //  اتصال به DOM
  // ═══════════════════════════════════════════════════════════
  document.addEventListener('DOMContentLoaded', function() {
    render(store.get());
  });
</script>
