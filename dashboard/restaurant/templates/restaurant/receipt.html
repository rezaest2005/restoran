<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>رسید سفارش</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
<style>
:root {
  --rc-width: 320px;
  --rc-bg: #fffdf8;
  --rc-border: #1a1a1a;
  --rc-text: #111;
  --rc-muted: #666;
  --rc-dash: #222;
  --rc-highlight: #d32f2f;
  --rc-accent: #1a6b3c;
}

* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family:'Vazirmatn',sans-serif;
  background:#e8e8e8;
  display:flex; flex-direction:column; align-items:center;
  min-height:100vh; padding:80px 20px 40px; direction:rtl;
}

/* ═══ Demo Buttons ═══ */
.demo-bar {
  position:fixed; top:0; left:0; right:0; z-index:100;
  background:rgba(0,0,0,.92); backdrop-filter:blur(10px);
  padding:14px 20px; display:flex; justify-content:center; gap:12px;
  box-shadow:0 4px 24px rgba(0,0,0,.3);
}
.demo-btn {
  padding:10px 24px; border:2px solid transparent; border-radius:10px;
  font-family:inherit; font-size:13px; font-weight:800;
  cursor:pointer; transition:all .2s; display:flex; align-items:center; gap:6px;
}
.demo-btn-customer { background:#fff; color:#111; }
.demo-btn-customer:hover { background:#f0f0f0; transform:translateY(-2px); box-shadow:0 6px 20px rgba(0,0,0,.3); }
.demo-btn-kitchen { background:var(--rc-highlight); color:#fff; }
.demo-btn-kitchen:hover { background:#b71c1c; transform:translateY(-2px); box-shadow:0 6px 20px rgba(211,47,47,.4); }
.demo-btn-both { background:var(--rc-accent); color:#fff; }
.demo-btn-both:hover { background:#155a30; transform:translateY(-2px); }

/* ═══ Receipt Frame ═══ */
.rc {
  width:var(--rc-width);
  background:var(--rc-bg);
  border:3px solid var(--rc-border);
  border-radius:2px;
  font-size:12.5px;
  color:var(--rc-text);
  position:relative;
  box-shadow:0 8px 40px rgba(0,0,0,.15);
  /* subtle paper texture */
  background-image:url("data:image/svg+xml,%3Csvg width='100' height='100' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100' height='100' filter='url(%23n)' opacity='.03'/%3E%3C/svg%3E");
}

/* ── Header ── */
.rc-header {
  padding:18px 16px 14px;
  text-align:center;
  border-bottom:2px dashed var(--rc-dash);
}
.rc-logo {
  font-size:19px; font-weight:900;
  letter-spacing:-0.5px; margin-bottom:12px;
  display:flex; align-items:center; justify-content:center; gap:6px;
}
.rc-logo-icon { font-size:22px; }
.rc-divider { border:none; border-top:2px dashed var(--rc-dash); margin:0; }
.rc-info {
  display:grid; grid-template-columns:1fr 1fr;
  gap:5px 10px; text-align:right; font-size:11px;
}
.rc-info-item {
  display:flex; align-items:center; gap:4px;
}
.rc-info-label { font-weight:600; color:var(--rc-muted); }
.rc-info-val { font-weight:800; }
.rc-info-full { grid-column:1/-1; }
.rc-info-highlight {
  color:var(--rc-highlight); font-weight:900;
}

/* ── Main Table ── */
.rc-main { padding:10px 14px; }
.rc-table {
  width:100%; border-collapse:collapse;
}
.rc-table thead th {
  font-size:10.5px; font-weight:800;
  padding:6px 2px 8px;
  border-bottom:2px solid var(--rc-dash);
  text-align:right; color:var(--rc-muted);
  text-transform:uppercase; letter-spacing:.3px;
}
.rc-table thead th.rc-col-num { text-align:center; width:50px; }
.rc-table thead th.rc-col-price { text-align:left; width:75px; }

.rc-table tbody td {
  padding:7px 2px;
  border-bottom:1px dashed #ccc;
  font-size:12px; font-weight:600;
}
.rc-table tbody td.rc-col-num {
  text-align:center; font-weight:800;
  font-size:13px;
}
.rc-table tbody td.rc-col-price {
  text-align:left; font-weight:700;
  white-space:nowrap; direction:ltr;
  font-variant-numeric:tabular-nums;
}
.rc-table tbody tr:last-child td { border-bottom:none; }

/* ── Total ── */
.rc-total {
  padding:12px 14px;
  border-top:2px dashed var(--rc-dash);
  display:flex; justify-content:space-between; align-items:center;
}
.rc-total-label { font-size:14px; font-weight:900; }
.rc-total-val {
  font-size:17px; font-weight:900;
  direction:ltr; display:flex; align-items:baseline; gap:4px;
}
.rc-total-unit { font-size:10px; font-weight:600; color:var(--rc-muted); }

/* ── Footer ── */
.rc-footer {
  padding:14px 16px;
  text-align:center;
  border-top:2px dashed var(--rc-dash);
}
.rc-thankyou {
  font-size:14px; font-weight:900;
  margin-bottom:3px;
}
.rc-footer-sub {
  font-size:10px; color:var(--rc-muted); font-weight:600;
}
.rc-footer-icon {
  font-size:20px; display:block; margin-bottom:6px;
}

/* ── Kitchen specific ── */
.rc.kitchen .rc-header { background:#fff5f5; }
.rc.kitchen .rc-logo { color:var(--rc-highlight); }
.rc.kitchen .rc-total { justify-content:center; gap:10px; }

/* ═══ Print Overlay ═══ */
.print-ov {
  display:none; position:fixed; inset:0;
  background:rgba(0,0,0,.55); z-index:500;
  justify-content:center; align-items:flex-start;
  padding:30px 16px; overflow-y:auto;
  backdrop-filter:blur(4px);
}
.print-ov.show { display:flex; }
.print-ov .rc {
  animation:rcUp .3s ease;
}
@keyframes rcUp {
  from { opacity:0; transform:translateY(20px); }
  to { opacity:1; transform:translateY(0); }
}
.print-actions {
  display:flex; gap:8px; justify-content:center; margin-top:14px;
}
.print-actions button {
  padding:10px 24px; border:none; border-radius:8px;
  font-family:inherit; font-size:13px; font-weight:700;
  cursor:pointer; transition:all .2s;
  display:flex; align-items:center; gap:6px;
}
.pa-print { background:#111; color:#fff; }
.pa-print:hover { background:#333; }
.pa-close { background:#eee; color:#333; }
.pa-close:hover { background:#ddd; }

/* ═══ Print ═══ */
@media print {
  body * { visibility:hidden; }
  .rc, .rc * { visibility:visible; }
  .rc { position:absolute; top:0; right:0; box-shadow:none; border-width:2px; }
  .print-actions, .print-ov { display:none!important; }
  @page { size:auto; margin:5mm; }
}

/* ═══ Responsive ═══ */
@media (max-width:400px) {
  .rc { width:100%; border-width:2px; }
  .rc-header { padding:14px 12px 10px; }
  .rc-logo { font-size:16px; }
  .rc-main { padding:8px 10px; }
  .rc-table thead th { font-size:10px; }
  .rc-table tbody td { font-size:11px; padding:6px 2px; }
}
</style>
</head>
<body>

<!-- ═══ Demo Bar ═══ -->
<div class="demo-bar">
  <button class="demo-btn demo-btn-customer" onclick="showCustomer()">
    <i class="bi bi-receipt-cutoff"></i> رسید مشتری
  </button>
  <button class="demo-btn demo-btn-kitchen" onclick="showKitchen()">
    <i class="bi bi-fire"></i> رسید آشپزخانه
  </button>
  <button class="demo-btn demo-btn-both" onclick="showBoth()">
    <i class="bi bi-printer"></i> هر دو
  </button>
</div>

<!-- ═══ Print Overlay ═══ -->
<div class="print-ov" id="printOv">
  <div id="printArea"></div>
</div>

<script>
/* ═══════════════════════════════════
   Helper Functions
   ═══════════════════════════════════ */

var PERSIAN_DIGITS = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];

function toPersianNum(n) {
  return String(n).replace(/\d/g, function(d){ return PERSIAN_DIGITS[+d]; });
}

function formatPrice(amount) {
  var parts = Number(amount).toLocaleString('en-US').split(',');
  return toPersianNum(parts.join(','));
}

function formatTime(d) {
  var h = d.getHours(), m = d.getMinutes();
  return toPersianNum(h < 10 ? '0'+h : h) + ':' + toPersianNum(m < 10 ? '0'+m : m);
}

function receiptNum(id) {
  return toPersianNum(id || Math.floor(1000 + Math.random() * 9000));
}

function esc(s) {
  var d = document.createElement('div');
  d.textContent = s || '';
  return d.innerHTML;
}

/* ═══════════════════════════════════
   Customer Receipt
   ═══════════════════════════════════ */

function printCustomerReceipt(order) {
  var now = new Date();
  var delivery = new Date(now.getTime() + 20 * 60 * 1000);
  var totalQty = 0, totalPrice = 0;

  order.items.forEach(function(it) {
    totalQty += it.qty;
    totalPrice += it.qty * it.price;
  });

  var rows = '';
  order.items.forEach(function(it, i) {
    rows += '<tr>'
      + '<td>' + esc(it.name) + '</td>'
      + '<td class="rc-col-num">' + toPersianNum(it.qty) + '</td>'
      + '<td class="rc-col-price">' + formatPrice(it.qty * it.price) + '</td>'
      + '</tr>';
  });

  var html = ''
    + '<div class="rc">'
    + '<div class="rc-header">'
    + '  <div class="rc-logo"><span class="rc-logo-icon">🍕</span> رستوران پیتزا لند</div>'
    + '  <div class="rc-info">'
    + '    <div class="rc-info-item"><span class="rc-info-label">شماره فیش:</span><span class="rc-info-val rc-info-highlight">#' + receiptNum(order.id) + '</span></div>'
    + '    <div class="rc-info-item"><span class="rc-info-label">میز:</span><span class="rc-info-val">' + toPersianNum(order.table || '—') + '</span></div>'
    + '    <div class="rc-info-item"><span class="rc-info-label">ساعت سفارش:</span><span class="rc-info-val">' + formatTime(now) + '</span></div>'
    + '    <div class="rc-info-item"><span class="rc-info-label">تخمین تحویل:</span><span class="rc-info-val rc-info-highlight">' + formatTime(delivery) + '</span></div>'
    + '  </div>'
    + '</div>'
    + '<div class="rc-main">'
    + '  <table class="rc-table">'
    + '    <thead><tr>'
    + '      <th>غذا</th>'
    + '      <th class="rc-col-num">تعداد</th>'
    + '      <th class="rc-col-price">مبلغ (تومان)</th>'
    + '    </tr></thead>'
    + '    <tbody>' + rows + '</tbody>'
    + '  </table>'
    + '</div>'
    + '<div class="rc-total">'
    + '  <div class="rc-total-label">جمع کل:</div>'
    + '  <div class="rc-total-val">' + formatPrice(totalPrice) + ' <span class="rc-total-unit">تومان</span></div>'
    + '</div>'
    + '<div class="rc-footer">'
    + '  <span class="rc-footer-icon">🙏</span>'
    + '  <div class="rc-thankyou">از خرید شما متشکریم</div>'
    + '  <div class="rc-footer-sub">منتظر حضور مجدد شما هستیم</div>'
    + '</div>'
    + '</div>';

  showReceipt(html);
}

/* ═══════════════════════════════════
   Kitchen Receipt
   ═══════════════════════════════════ */

function printKitchenReceipt(order) {
  var now = new Date();
  var totalQty = 0;

  order.items.forEach(function(it) { totalQty += it.qty; });

  var rows = '';
  order.items.forEach(function(it) {
    rows += '<tr>'
      + '<td>' + esc(it.name) + '</td>'
      + '<td class="rc-col-num">' + toPersianNum(it.qty) + '</td>'
      + '</tr>';
  });

  var html = ''
    + '<div class="rc kitchen">'
    + '<div class="rc-header">'
    + '  <div class="rc-logo"><span class="rc-logo-icon">🔥</span> آشپزخانه</div>'
    + '  <div class="rc-info">'
    + '    <div class="rc-info-item"><span class="rc-info-label">شماره فیش:</span><span class="rc-info-val rc-info-highlight">#' + receiptNum(order.id) + '</span></div>'
    + '    <div class="rc-info-item"><span class="rc-info-label">میز:</span><span class="rc-info-val">' + toPersianNum(order.table || '—') + '</span></div>'
    + '    <div class="rc-info-item rc-info-full"><span class="rc-info-label">ساعت:</span><span class="rc-info-val">' + formatTime(now) + '</span></div>'
    + '  </div>'
    + '</div>'
    + '<div class="rc-main">'
    + '  <table class="rc-table">'
    + '    <thead><tr>'
    + '      <th>غذا</th>'
    + '      <th class="rc-col-num">تعداد</th>'
    + '    </tr></thead>'
    + '    <tbody>' + rows + '</tbody>'
    + '  </table>'
    + '</div>'
    + '<div class="rc-total">'
    + '  <div class="rc-total-label">تعداد کل آیتم‌ها:</div>'
    + '  <div class="rc-total-val">' + toPersianNum(totalQty) + '</div>'
    + '</div>'
    + '</div>';

  showReceipt(html);
}

/* ═══════════════════════════════════
   Show / Close
   ═══════════════════════════════════ */

function showReceipt(html) {
  var area = document.getElementById('printArea');
  var ov = document.getElementById('printOv');

  area.innerHTML = html
    + '<div class="print-actions">'
    + '  <button class="pa-print" onclick="window.print()"><i class="bi bi-printer"></i> چاپ</button>'
    + '  <button class="pa-close" onclick="closePrint()"><i class="bi bi-x-lg"></i> بستن</button>'
    + '</div>';

  ov.classList.add('show');
}

function closePrint() {
  document.getElementById('printOv').classList.remove('show');
}

document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') closePrint();
});
document.getElementById('printOv').addEventListener('click', function(e) {
  if (e.target === this) closePrint();
});

/* ═══════════════════════════════════
   Demo Data
   ═══════════════════════════════════ */

var demoOrder = {
  id: 4521,
  table: 7,
  items: [
    { name: 'پیتزا مخصوص بزرگ', qty: 2, price: 285000 },
    { name: 'همبرگر ویژه دوبل',  qty: 1, price: 195000 },
    { name: 'سالاد سزار',        qty: 1, price: 85000  },
    { name: 'نوشابه قوطی',       qty: 4, price: 25000  },
    { name: 'سس مخصوص تک‌نفره',  qty: 3, price: 10000  },
  ]
};

function showCustomer() { printCustomerReceipt(demoOrder); }
function showKitchen() { printKitchenReceipt(demoOrder); }
function showBoth() {
  printKitchenReceipt(demoOrder);
  setTimeout(function() { closePrint(); printCustomerReceipt(demoOrder); }, 600);
}
</script>
</body>
</html>
