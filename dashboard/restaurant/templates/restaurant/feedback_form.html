<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ثبت نظر{% if restaurant %} — {{ restaurant.name }}{% endif %}</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; padding: 16px; background: #f0f4f8; color: #1b2a4a;
         font-family: Vazirmatn, Tahoma, sans-serif; font-size: 15px; }
  .card { max-width: 520px; margin: 0 auto; background: #fff; border-radius: 14px;
          padding: 20px; box-shadow: 0 2px 12px rgba(27,42,74,.08); }
  h1 { font-size: 20px; margin: 0 0 6px; }
  p.sub { color: #7a8fa3; margin: 0 0 16px; }
  label { display: block; font-weight: 600; margin: 14px 0 6px; }
  input, select, textarea { width: 100%; padding: 10px 12px; border: 1.5px solid #d0dbe8;
         border-radius: 10px; font: inherit; background: #fff; }
  textarea { min-height: 130px; resize: vertical; }
  button { width: 100%; margin-top: 18px; padding: 12px; border: 0; border-radius: 10px;
           background: #1b2a4a; color: #fff; font: inherit; font-weight: 700; cursor: pointer; }
  button:disabled { opacity: .6; }
  .msg { margin-top: 14px; padding: 10px 12px; border-radius: 10px; display: none; }
  .msg.ok { display: block; background: #e6f9ee; color: #1a7f45; }
  .msg.err { display: block; background: #fdeaea; color: #c0392b; }
  /* honeypot: برای کاربر واقعی دیده نمی‌شود */
  .hp { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }
</style>
</head>
<body>
<div class="card">
{% if not restaurant %}
  <h1>رستوران یافت نشد</h1>
  <p class="sub">این لینک معتبر نیست.</p>
{% else %}
  <h1>ثبت نظر یا گزارش مشکل</h1>
  <p class="sub">{{ restaurant.name }}</p>
  <form id="fbForm" autocomplete="off">
    <label for="category">موضوع</label>
    <select id="category" name="category">
      {% for value, label in categories %}
      <option value="{{ value }}"{% if value == 'complaint' %} selected{% endif %}>{{ label }}</option>
      {% endfor %}
    </select>

    <label for="name">نام (اختیاری)</label>
    <input id="name" name="name" maxlength="100">

    <label for="phone">شماره تماس (اختیاری)</label>
    <input id="phone" name="phone" type="tel" inputmode="tel" maxlength="20" dir="ltr">

    <label for="message">متن پیام</label>
    <textarea id="message" name="message" maxlength="2000" required></textarea>

    <div class="hp" aria-hidden="true">
      <label for="website">website</label>
      <input id="website" name="website" tabindex="-1" autocomplete="off">
    </div>

    <button type="submit" id="btn">ارسال</button>
    <div id="msg" class="msg"></div>
  </form>
{% endif %}
</div>
{% if restaurant %}
<script>
  const form = document.getElementById('fbForm');
  const msg = document.getElementById('msg');
  const btn = document.getElementById('btn');
  function show(cls, text) { msg.className = 'msg ' + cls; msg.textContent = text; }
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    btn.disabled = true;
    msg.className = 'msg';
    const body = {
      restaurant_slug: "{{ restaurant.slug|escapejs }}",
      category: form.category.value,
      name: form.name.value,
      phone: form.phone.value,
      message: form.message.value,
      website: form.website.value,
    };
    try {
      const res = await fetch('/api/feedback/submit/', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
      const data = await res.json().catch(() => ({}));
      if (res.ok && data.success) {
        show('ok', data.message || 'نظر شما ثبت شد.');
        form.reset();
      } else {
        show('err', data.error || data.message || 'خطا در ارسال. دوباره تلاش کنید.');
      }
    } catch (err) {
      show('err', 'خطای ارتباط با سرور.');
    } finally {
      btn.disabled = false;
    }
  });
</script>
{% endif %}
</body>
</html>
