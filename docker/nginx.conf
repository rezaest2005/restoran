# Docker's embedded DNS: re-resolve the "api" service name regularly.
resolver 127.0.0.11 valid=10s ipv6=off;

# Preserve the scheme set by an upstream TLS terminator, if any.
map $http_x_forwarded_proto $fwd_proto {
    default $scheme;
    https   https;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;
    client_max_body_size 10M;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # ---- SPA assets (built into this image) ----
    location ^~ /assets/ {
        root /usr/share/nginx/html;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ---- Django static + uploaded media: served directly from disk ----
    location /static/ {
        alias /usr/share/nginx/static/;
        expires 30d;
        add_header Cache-Control "public";
    }

    location /media/ {
        alias /srv/media/;
        expires 7d;
    }

    # ---- API and admin -> api service ----
    location /api/ {
        set $backend http://api:8000;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        proxy_next_upstream error timeout http_502 http_504;
    }

    # QR short links: api answers with a 302 to the configured target
    location /q/ {
        set $backend http://api:8000;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }

    # Django admin (the super admin panel of the SPA owns /admin/login)
    location /django-admin/ {
        set $backend http://api:8000;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        proxy_next_upstream error timeout http_502 http_504;
    }

    # ---- multi-tenant API prefix: /{slug}/api/... ----
    location ~ ^/[a-z0-9-]+/api/ {
        set $backend http://api:8000;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        proxy_next_upstream error timeout http_502 http_504;
    }

    # service worker و manifest نباید مدت طولانی کش شوند
    # the courier pages (/<slug>/bizsuite_driver/N) install as an app; their worker lives at /sw.js (or <prefix>/sw.js)
    location = /sw.js {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache";
        add_header Service-Worker-Allowed "/";
    }

    # ---- React SPA ----
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
